<!DOCTYPE html>

<html lang="cs">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Cosmos Explorer | Advanced 3D Solar System</title>

    <meta name="description" content="Interaktivní 3D simulace sluneční soustavy. Prozkoumejte planety v reálném čase, upravte běh času a objevte detailní informace.">

    <meta name="keywords" content="vesmír, 3D, simulace, sluneční soustava, planety, interaktivní, HTML5, CSS3, JavaScript, webgl, canvas">

    <meta name="author" content="Tomáš Vrabec">

    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Cosmos Explorer 3D">

    <meta property="og:description" content="Neuvěřitelná interaktivní webová simulace naší sluneční soustavy.">

    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">



    <script type="application/ld+json">

    {

      "@context": "https://schema.org",

      "@type": "WebApplication",

      "name": "Cosmos Explorer 3D",

      "applicationCategory": "EducationalApplication",

      "author": { "@type": "Person", "name": "Tomáš Vrabec" }

    }

    </script>



    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css?v=7">

</head>

<body class="loading">

    <div id="preloader" aria-hidden="true">

        <div class="loader-core"></div>

        <div class="loader-text">INICIALIZACE VESMÍRU... <span id="load-progress">0%</span></div>

    </div>



    <canvas id="deep-space" aria-hidden="true"></canvas>



    <main id="scene-container" aria-label="3D Interaktivní Vesmír">

        <div id="camera">

            <div id="solar-system" class="preserve-3d">

                <!-- SUN -->
                <div class="celestial-wrapper sun-wrapper" data-id="sun">
                    <div class="planet sun" role="button" tabindex="0" aria-label="Slunce">
                        <div class="planet-sphere sun-sphere"></div>
                        <div class="sun-glow"></div>
                        <span class="planet-name">SLUNCE</span>
                    </div>
                </div>

                <!-- VOYAGER -->
                <div class="orbit voyager-orbit preserve-3d" aria-hidden="true">
                    <div class="voyager">
                        <div class="voyager-dish"></div>
                        <div class="voyager-body"></div>
                    </div>
                </div>

                <!-- MERCURY -->
                <div class="orbit mercury-orbit preserve-3d" aria-hidden="true"></div>
                <div class="celestial-wrapper mercury-wrapper" data-id="mercury">
                    <div class="planet mercury" role="button" tabindex="0" aria-label="Merkur">
                        <div class="planet-sphere mercury-sphere"></div>
                        <div class="planet-shadow"></div>
                        <span class="planet-name">MERKUR</span>
                    </div>
                </div>

                <!-- VENUS -->
                <div class="orbit venus-orbit preserve-3d" aria-hidden="true"></div>
                <div class="celestial-wrapper venus-wrapper" data-id="venus">
                    <div class="planet venus" role="button" tabindex="0" aria-label="Venuše">
                        <div class="planet-sphere venus-sphere"></div>
                        <div class="planet-shadow"></div>
                        <span class="planet-name">VENUŠE</span>
                    </div>
                </div>

                <!-- EARTH -->
                <div class="orbit earth-orbit preserve-3d" aria-hidden="true"></div>
                <div class="celestial-wrapper earth-wrapper" data-id="earth">
                    <div class="planet earth" role="button" tabindex="0" aria-label="Země">
                        <div class="planet-sphere earth-sphere">
                            <div class="earth-clouds"></div>
                        </div>
                        <div class="planet-shadow"></div>
                        <div class="moon-orbit"><div class="moon-sphere"></div></div>
                        <div class="iss-orbit"><div class="iss"></div></div>
                        <span class="planet-name">ZEMĚ</span>
                    </div>
                </div>

                <!-- MARS -->
                <div class="orbit mars-orbit preserve-3d" aria-hidden="true"></div>
                <div class="celestial-wrapper mars-wrapper" data-id="mars">
                    <div class="planet mars" role="button" tabindex="0" aria-label="Mars">
                        <div class="planet-sphere mars-sphere"></div>
                        <div class="planet-shadow"></div>
                        <span class="planet-name">MARS</span>
                    </div>
                </div>

                <!-- ASTEROID BELT -->
                <div id="asteroid-belt" class="preserve-3d" aria-hidden="true"></div>

                <!-- JUPITER -->
                <div class="orbit jupiter-orbit preserve-3d" aria-hidden="true"></div>
                <div class="celestial-wrapper jupiter-wrapper" data-id="jupiter">
                    <div class="planet jupiter" role="button" tabindex="0" aria-label="Jupiter">
                        <div class="planet-sphere jupiter-sphere"></div>
                        <div class="planet-shadow"></div>
                        <span class="planet-name">JUPITER</span>
                    </div>
                </div>

                <!-- SATURN -->
                <div class="orbit saturn-orbit preserve-3d" aria-hidden="true"></div>
                <div class="celestial-wrapper saturn-wrapper" data-id="saturn">
                    <div class="planet saturn" role="button" tabindex="0" aria-label="Saturn">
                        <div class="planet-sphere saturn-sphere"></div>
                        <div class="saturn-rings"></div>
                        <div class="planet-shadow"></div>
                        <span class="planet-name">SATURN</span>
                    </div>
                </div>

                <!-- URANUS -->
                <div class="orbit uranus-orbit preserve-3d" aria-hidden="true"></div>
                <div class="celestial-wrapper uranus-wrapper" data-id="uranus">
                    <div class="planet uranus" role="button" tabindex="0" aria-label="Uran">
                        <div class="planet-sphere uranus-sphere"></div>
                        <div class="uranus-rings"></div>
                        <div class="planet-shadow"></div>
                        <span class="planet-name">URAN</span>
                    </div>
                </div>

                <!-- NEPTUNE -->
                <div class="orbit neptune-orbit preserve-3d" aria-hidden="true"></div>
                <div class="celestial-wrapper neptune-wrapper" data-id="neptune">
                    <div class="planet neptune" role="button" tabindex="0" aria-label="Neptun">
                        <div class="planet-sphere neptune-sphere"></div>
                        <div class="planet-shadow"></div>
                        <span class="planet-name">NEPTUN</span>
                    </div>
                </div>

            </div>

        </div>

    </main>



    <div id="ui-layer" class="ui-layer">

        <header class="top-bar">

            <div class="brand">

                <div class="brand-text">

                    <h1>COSMOS<span class="hl">OS</span> v2.0</h1>

                    <span class="subtitle">STELLAR ENGINE EXPERT</span>

                </div>

            </div>

            <div class="controls-group">

                <div class="control-box">

                    <label for="teleport-select">RYCHLÝ TELEPORT</label>

                    <select id="teleport-select" class="holo-select">

                        <option value="">-- VYBERTE CÍL --</option>

                        <option value="sun">Slunce</option>

                        <option value="mercury">Merkur</option>

                        <option value="venus">Venuše</option>

                        <option value="earth">Země</option>

                        <option value="mars">Mars</option>

                        <option value="jupiter">Jupiter</option>

                        <option value="saturn">Saturn</option>

                        <option value="uranus">Uran</option>

                        <option value="neptune">Neptun</option>

                    </select>

                </div>



                <div class="control-box hidden-mobile">

                    <label>POHLED</label>

                    <div class="view-presets">

                        <button class="btn-view active" id="view-top"    aria-label="Pohled shora">TOP</button>

                        <button class="btn-view"        id="view-side"   aria-label="Pohled ze strany">SIDE</button>

                        <button class="btn-view"        id="view-cinematic" aria-label="Pohled z hlubiny">DEEP</button>

                    </div>

                </div>



                <div class="control-box hidden-mobile">

                    <label for="time-slider">ZAKŘIVENÍ ČASU</label>

                    <div class="slider-wrapper">

                        <input type="range" id="time-slider" min="0" max="10" step="0.1" value="1" aria-label="Rychlost oběhu planet">

                        <span id="time-val">1.0x</span>

                    </div>

                </div>



                <div class="btn-group">

                    <button id="pause-btn"    class="btn-holo" aria-label="Pozastavit" title="Pause / Play">⏸</button>

                    <button id="reset-cam-btn" class="btn-holo" aria-label="Reset pohledu">RESET</button>

                    <button id="fullscreen-btn" class="btn-holo" aria-label="Celá obrazovka" title="Fullscreen">⛶</button>

                    <button id="sound-btn" class="btn-holo" aria-label="Zvuk zapnout/vypnout" title="Sound On/Off">🔊</button>

                </div>

            </div>

        </header>



        <aside id="hud-panel" class="hud-panel glass-morphism" aria-hidden="true" role="dialog" aria-labelledby="hud-title">

            <div class="hud-header">

                <div class="hud-decor"></div>

                <h2 id="hud-title" class="glitch" data-text="PLANET_NAME">PLANET_NAME</h2>

                <button id="close-hud" class="close-hud" aria-label="Zavřít detail">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>

                </button>

            </div>

            <div class="hud-body">

                <div class="hud-type" id="hud-type">CLASSIFICATION</div>

                <div class="hud-text-container">

                    <p id="hud-desc" class="typing-text"></p>

                </div>

                <div class="data-grid">

                    <div class="data-cell"><span class="data-label">VZDÁLENOST</span><span class="data-value" id="data-dist">--</span></div>

                    <div class="data-cell"><span class="data-label">TEPLOTA</span><span class="data-value" id="data-temp">--</span></div>

                    <div class="data-cell"><span class="data-label">GRAVITACE</span><span class="data-value" id="data-grav">--</span></div>

                    <div class="data-cell"><span class="data-label">DOBA OBĚHU</span><span class="data-value" id="data-year">--</span></div>

                    <div class="data-cell"><span class="data-label">POČET MĚSÍCŮ</span><span class="data-value" id="data-moons">--</span></div>

                    <div class="data-cell"><span class="data-label">ATMOSFÉRA</span><span class="data-value" id="data-atm">--</span></div>

                </div>

                <div class="hud-footer">

                    <div class="status-indicator">

                        <span class="dot blink"></span> DATA ZACHYCENA SONDOU

                    </div>

                    <button class="btn-holo btn-sm" id="btn-explore">VSTOUPIT DO ATMOSFÉRY</button>

                </div>

            </div>

        </aside>



        <div id="env-hud" class="env-hud visually-hidden">

            <div class="env-warning glitch" data-text="STATUS">STATUS</div>

            <button id="btn-leave-env" class="btn-holo btn-danger">OPUSTIT ATMOSFÉRU</button>

        </div>



        <div class="radar-container">

            <div class="radar">

                <div class="radar-sweep"></div>

                <div class="radar-ring1"></div>

                <div class="radar-ring2"></div>

                <div class="radar-center"></div>

                <div id="radar-blips"></div>

            </div>

            <div class="radar-label">SEKTOR 0-0-0</div>

        </div>



        <div id="aria-live" class="visually-hidden" aria-live="assertive"></div>

    </div>



    <script src="js/script.js?v=7"></script>

</body>

</html>
